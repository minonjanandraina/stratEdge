{% extends "base.html" %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center login-bg">

  <!-- Dark/Light -->
  <div class="absolute top-4 right-4">
    <button 
      @click="toggleDark()" 
      class="w-9 h-9 rounded-xl flex items-center justify-center transition-all duration-200 hover:shadow-md"
      style="
        background: var(--bg-card); 
        color: var(--text-2);
        border: 1px solid var(--border-s);
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      "
      :title="dark ? 'Mode clair' : 'Mode sombre'"
    >
      <template x-if="dark">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 7a5 5 0 110 10 5 5 0 010-10z"/>
        </svg>
      </template>
      <template x-if="!dark">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </template>
    </button>
  </div>

  <div class="w-full max-w-[360px] px-4">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      {% load static %}
      <img src="{% static 'img/logo.png' %}" alt="StratEdge" class="h-20 w-auto object-contain mb-2">
    </div>

    <!-- Card -->
    <div class="rounded-[18px] px-7 py-7" style="background: var(--bg-card); box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 12px 40px rgba(0,0,0,0.10);">

      {% if form.errors %}
      <div class="mb-5 px-4 py-3 rounded-xl bg-[#FF3B30]/08 border border-[#FF3B30]/20 text-[#C62B22] dark:text-[#FF6961] text-[13px] flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        Identifiants invalides. Veuillez réessayer.
      </div>
      {% endif %}

      <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
          <label for="id_username" class="block text-[13px] font-medium mb-1.5" style="color: var(--text-1)">
            Identifiant
          </label>
          <input type="text" name="username" id="id_username" required autofocus
                 class="apple-input" placeholder="Votre nom d'utilisateur">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="id_password" class="block text-[13px] font-medium" style="color: var(--text-1)">Mot de passe</label>
            <a href="{% url 'password-reset' %}" class="text-[12px] text-[#007AFF] hover:underline">Mot de passe oublié ?</a>
          </div>
          <input type="password" name="password" id="id_password" required
                 class="apple-input" placeholder="••••••••">
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit" class="apple-btn-primary w-full justify-center py-2.5 mt-2 text-[15px] font-medium rounded-xl">
          Se connecter
        </button>
      </form>
    </div>

    <p class="text-center text-[13px] mt-5" style="color: var(--text-2)">
      Pas encore de compte ?
      <a href="{% url 'register' %}" class="text-[#007AFF] hover:underline font-medium">Créer un compte</a>
    </p>

    <p class="text-center text-[12px] mt-4" style="color: var(--text-3)">
      StratEdge &copy; {{ "now"|date:"Y" }} &mdash; DFS Project Management
    </p>
  </div>
</div>

{% endblock %}
