<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — StratEdge</title>
  <script>(function(){const t=localStorage.getItem('theme');if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');})()</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','"SF Pro Display"','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { -webkit-font-smoothing: antialiased; background: #F0F0F5; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md text-center">

    <!-- Logo -->
    <div class="mb-8">
      <span class="text-[17px] font-semibold text-[#1D1D1F] tracking-tight">StratEdge</span>
    </div>

    <!-- Illustration -->
    <div class="w-20 h-20 mx-auto mb-6 rounded-3xl flex items-center justify-center"
         style="background: rgba(0,122,255,0.10);">
      <svg class="w-10 h-10 text-[#007AFF]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803 7.5 7.5 0 0015.803 15.803zM13.5 10.5h-6"/>
      </svg>
    </div>

    <!-- Code -->
    <p class="text-[13px] font-semibold text-[#007AFF] uppercase tracking-widest mb-2">Erreur 404</p>

    <!-- Titre -->
    <h1 class="text-[28px] font-semibold text-[#1D1D1F] tracking-tight mb-3">Page introuvable</h1>

    <!-- Description -->
    <p class="text-[15px] text-[#6E6E73] leading-relaxed mb-3">
      La page que vous cherchez n'existe pas ou a été déplacée.
    </p>
    {% if request_path %}
    <p class="text-[12.5px] text-[#AEAEB2] mb-8 font-mono bg-white/60 rounded-lg px-3 py-2 inline-block">
      {{ request_path }}
    </p>
    {% else %}
    <div class="mb-8"></div>
    {% endif %}

    <!-- Actions -->
    <div class="flex items-center justify-center gap-3">
      <a href="/"
         class="inline-flex items-center gap-2 bg-[#007AFF] text-white px-5 py-2.5 rounded-xl text-[14px] font-medium hover:bg-[#0063CC] transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Accueil
      </a>
      <a href="/projects/"
         class="inline-flex items-center gap-2 bg-black/[0.06] text-[#1D1D1F] px-5 py-2.5 rounded-xl text-[14px] font-medium hover:bg-black/[0.10] transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        Mes projets
      </a>
    </div>

    <p class="mt-8 text-[12.5px] text-[#AEAEB2]">
      Si le problème persiste, contactez votre administrateur.
    </p>

  </div>

</body>
</html>
