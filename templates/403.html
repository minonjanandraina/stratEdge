<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès refusé — StratEdge</title>
  <script>(function(){const t=localStorage.getItem('theme');if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');})()</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','"SF Pro Display"','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { -webkit-font-smoothing: antialiased; background: #F0F0F5; }
    .dark body, .dark body { background: #111113; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 dark:bg-[#111113]">

  <div class="w-full max-w-md text-center">

    <!-- Logo -->
    <div class="mb-8">
      <span class="text-[17px] font-semibold text-[#1D1D1F] tracking-tight">StratEdge</span>
    </div>

    <!-- Icône -->
    <div class="w-20 h-20 mx-auto mb-6 rounded-3xl flex items-center justify-center"
         style="background: rgba(255,59,48,0.10);">
      <svg class="w-10 h-10 text-[#FF3B30]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
      </svg>
    </div>

    <!-- Code -->
    <p class="text-[13px] font-semibold text-[#FF3B30] uppercase tracking-widest mb-2">Erreur 403</p>

    <!-- Titre -->
    <h1 class="text-[28px] font-semibold text-[#1D1D1F] tracking-tight mb-3">Accès refusé</h1>

    <!-- Description -->
    <p class="text-[15px] text-[#6E6E73] leading-relaxed mb-8">
      Vous n'avez pas les droits nécessaires pour accéder à cette page.<br>
      Contactez votre chef de projet si vous pensez que c'est une erreur.
    </p>

    <!-- Actions -->
    <div class="flex items-center justify-center gap-3">
      <a href="/"
         class="inline-flex items-center gap-2 bg-[#007AFF] text-white px-5 py-2.5 rounded-xl text-[14px] font-medium hover:bg-[#0063CC] transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Accueil
      </a>
      <a href="javascript:history.back()"
         class="inline-flex items-center gap-2 bg-black/[0.06] text-[#1D1D1F] px-5 py-2.5 rounded-xl text-[14px] font-medium hover:bg-black/[0.10] transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Retour
      </a>
    </div>

    <!-- Aide connexion -->
    <p class="mt-8 text-[12.5px] text-[#AEAEB2]">
      Pas encore connecté ?
      <a href="/accounts/login/" class="text-[#007AFF] hover:underline">Se connecter</a>
    </p>

  </div>

</body>
</html>
